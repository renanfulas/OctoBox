upstream octobox_app {
    server unix:/run/octobox/gunicorn.sock;
}

# Isolamento de seguranca da superficie de login/cadastro (student-login-security-isolation-corda.md).
# Este limite roda no Nginx, ANTES do Gunicorn/Django — diferente do rate limit
# Python (LOGIN_RATE_LIMIT_*, shared_support/security/__init__.py), que so rejeita
# depois que a requisicao ja ocupou um worker do Gunicorn. Os dois sao complementares:
# este aqui e a primeira barreira contra um flood volumetrico; o Python continua
# sendo a fonte de verdade para regra de negocio por escopo (login/oauth/invite/etc).
# rate=30r/m e deliberadamente mais generoso que qualquer LOGIN_RATE_LIMIT_* especifico
# (8 req/300s) — nao deve nunca bloquear um usuario real, so um flood automatizado.
limit_req_zone $binary_remote_addr zone=octobox_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name octoboxfit.com.br www.octoboxfit.com.br app.octoboxfit.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($host = octoboxfit.com.br) {
            return 301 https://www.octoboxfit.com.br$request_uri;
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name octoboxfit.com.br www.octoboxfit.com.br app.octoboxfit.com.br;

    ssl_certificate /etc/letsencrypt/live/octoboxfit.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoboxfit.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    if ($host = octoboxfit.com.br) {
        return 301 https://www.octoboxfit.com.br$request_uri;
    }

    location /static/ {
        alias /srv/octobox/app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # Superficie de login/cadastro/magic-link — mesma logica de negocio do
    # location / generico abaixo, so com o limite extra do Nginx na frente.
    # /aluno/auth/ (nao /aluno/ inteiro) para nao throttlear aluno logado usando
    # o app normalmente — so o fluxo de autenticacao do aluno (inclui
    # /aluno/auth/invite/ e /aluno/auth/box-invite/, que vivem sob este prefixo).
    location ~ ^/(login|checkout|onboarding|aluno/auth)(/|$) {
        limit_req zone=octobox_auth burst=15 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_pass http://octobox_app;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_pass http://octobox_app;
    }
}
