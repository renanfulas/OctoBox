name: Backup Integrity Check

# Valida que os scripts de backup (Postgres + env cifrado) realmente
# funcionam de ponta a ponta, nao so que "parseiam" sem erro de sintaxe.
#
# Por que existe: em 2026-08 descobrimos que o backup de producao (dump do
# Postgres e o octobox.env) parou de rodar de verdade sem que nenhum teste
# ou alerta pegasse isso — os scripts existiam e "pareciam certos" lendo o
# codigo, mas nunca foram exercitados em CI. Este workflow fecha esse gap:
# roda os scripts reais contra um Postgres de verdade e um par de chaves
# age de verdade, e falha o PR se o dump nao for restauravel ou se o
# roundtrip de criptografia do env quebrar.
# O job tenant-restore-semantic-smoke cobre o gate F2 com schemas reais
# do django-tenants e migrations do projeto.
#
# Roda em todo PR/push que toque nos scripts de backup ou nos workflows.

on:
  push:
    branches:
      - main
    paths:
      - "scripts/linux/backup_postgres.sh"
      - "scripts/linux/backup_and_sync_postgres.sh"
      - "scripts/linux/backup_tenant_schema.sh"
      - "scripts/linux/restore_tenant_schema.sh"
      - "scripts/linux/tenant_restore_external_dependencies.sql"
      - "scripts/linux/tenant_backup_manifest.py"
      - "scripts/linux/backup_env_secrets.sh"
      - "scripts/linux/setup_env_secrets_backup.sh"
      - "scripts/linux/setup_r2_backup.sh"
      - "scripts/linux/check_octobox_runtime.sh"
      - "control/management/commands/smoke_test_tenant.py"
      - "operations/management/commands/restore_snapshot.py"
      - "infra/hostgator-vps/systemd/**"
      - "docs/rollout/hostgator/backup*.md"
      - "docs/rollout/hostgator/restore.md"
      - "docs/rollout/restore-and-rollback-drill.md"
      - "docs/testing/tenant-restore-*.md"
      - "tests/test_tenant_backup_manifest.py"
      - "tests/test_restore_snapshot_disabled.py"
      - "tests/test_tenant_restore_semantic_smoke.py"
      - "tests/test_tenant_restore_external_dependencies.py"
      - "tests/test_tenant_restore_timer_inventory.py"
      - ".env.example"
      - ".github/workflows/backup-integrity-check.yml"
  pull_request:
    paths:
      - "scripts/linux/backup_postgres.sh"
      - "scripts/linux/backup_and_sync_postgres.sh"
      - "scripts/linux/backup_tenant_schema.sh"
      - "scripts/linux/restore_tenant_schema.sh"
      - "scripts/linux/tenant_restore_external_dependencies.sql"
      - "scripts/linux/tenant_backup_manifest.py"
      - "scripts/linux/backup_env_secrets.sh"
      - "scripts/linux/setup_env_secrets_backup.sh"
      - "scripts/linux/setup_r2_backup.sh"
      - "scripts/linux/check_octobox_runtime.sh"
      - "control/management/commands/smoke_test_tenant.py"
      - "operations/management/commands/restore_snapshot.py"
      - "infra/hostgator-vps/systemd/**"
      - "docs/rollout/hostgator/backup*.md"
      - "docs/rollout/hostgator/restore.md"
      - "docs/rollout/restore-and-rollback-drill.md"
      - "docs/testing/tenant-restore-*.md"
      - "tests/test_tenant_backup_manifest.py"
      - "tests/test_restore_snapshot_disabled.py"
      - "tests/test_tenant_restore_semantic_smoke.py"
      - "tests/test_tenant_restore_external_dependencies.py"
      - "tests/test_tenant_restore_timer_inventory.py"
      - ".env.example"
      - ".github/workflows/backup-integrity-check.yml"

jobs:
  # ---------------------------------------------------------------------------
  # Shellcheck em todos os scripts de backup/rollout — pega bug de quoting,
  # variavel nao definida, etc antes de chegar na VPS.
  # ---------------------------------------------------------------------------
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shellcheck nos scripts de backup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning \
            scripts/linux/backup_postgres.sh \
            scripts/linux/backup_and_sync_postgres.sh \
            scripts/linux/backup_tenant_schema.sh \
            scripts/linux/restore_tenant_schema.sh \
            scripts/linux/backup_env_secrets.sh \
            scripts/linux/setup_env_secrets_backup.sh \
            scripts/linux/setup_r2_backup.sh \
            scripts/linux/check_octobox_runtime.sh

  # ---------------------------------------------------------------------------
  # Postgres: exercise full + selected tenant archives and their manifests,
  # restoring only into a new isolated database with a real cross-schema FK.
  # ---------------------------------------------------------------------------
  postgres-dump-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        options: >-
          --health-cmd "pg_isready -U backup_check -d backup_check_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_DB: backup_check_source
          POSTGRES_USER: backup_check
          POSTGRES_PASSWORD: backup_check_password
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/15/bin:$PATH"
          test "$(pg_dump --version | sed -E 's/.* ([0-9]+)(\..*)?/\1/')" = '15'
          test "$(pg_restore --version | sed -E 's/.* ([0-9]+)(\..*)?/\1/')" = '15'

      - name: Popular banco com dois boxes, identidade e memberships canários
        env:
          PGPASSWORD: backup_check_password
        run: |
          psql --host 127.0.0.1 --port 5432 --username backup_check --dbname backup_check_source <<'SQL'
          CREATE TABLE public.backup_shared_canary (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO public.backup_shared_canary VALUES (41, 'shared-backup-integrity-check');
          CREATE TABLE public.backup_identity_canary (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO public.backup_identity_canary VALUES (7, 'identity-backup-integrity-check');
          CREATE TABLE public.backup_box_canary (schema_name text PRIMARY KEY, box_id integer NOT NULL);
          INSERT INTO public.backup_box_canary VALUES ('box_alpha', 1), ('box_bravo', 1);
          CREATE TABLE public.backup_membership_canary (
            schema_name text NOT NULL REFERENCES public.backup_box_canary(schema_name),
            student_id integer NOT NULL REFERENCES public.backup_identity_canary(id),
            marker text NOT NULL,
            PRIMARY KEY (schema_name, student_id)
          );
          INSERT INTO public.backup_membership_canary VALUES
            ('box_alpha', 7, 'membership-alpha'), ('box_bravo', 7, 'membership-bravo');
          CREATE SCHEMA box_alpha;
          CREATE SCHEMA box_bravo;
          CREATE TABLE box_alpha.backup_tenant_canary (
            id serial PRIMARY KEY,
            shared_id integer NOT NULL REFERENCES public.backup_shared_canary(id),
            student_id integer NOT NULL REFERENCES public.backup_identity_canary(id),
            marker text NOT NULL
          );
          CREATE TABLE box_bravo.backup_tenant_canary (
            id serial PRIMARY KEY,
            shared_id integer NOT NULL REFERENCES public.backup_shared_canary(id),
            student_id integer NOT NULL REFERENCES public.backup_identity_canary(id),
            marker text NOT NULL
          );
          INSERT INTO box_alpha.backup_tenant_canary(shared_id, student_id, marker)
          VALUES (41, 7, 'tenant-alpha-before-restore');
          INSERT INTO box_bravo.backup_tenant_canary(shared_id, student_id, marker)
          VALUES (41, 7, 'tenant-bravo-preserve-this');
          SQL

      - name: Registrar fingerprint semântico inicial do box B
        env:
          PGPASSWORD: backup_check_password
        run: |
          fingerprint="$(psql --host 127.0.0.1 --port 5432 --username backup_check \
            --dbname backup_check_source -v ON_ERROR_STOP=1 -tAc \
            "SELECT md5(concat_ws('|', b.box_id, t.id, t.shared_id, t.student_id, t.marker, s.marker, i.marker, m.marker)) \
             FROM box_bravo.backup_tenant_canary t \
             JOIN public.backup_shared_canary s ON s.id=t.shared_id \
             JOIN public.backup_identity_canary i ON i.id=t.student_id \
             JOIN public.backup_box_canary b ON b.schema_name='box_bravo' \
             JOIN public.backup_membership_canary m ON m.schema_name=b.schema_name AND m.student_id=t.student_id")"
          test -n "${fingerprint}"
          echo "BOX_BRAVO_FINGERPRINT=${fingerprint}" >> "$GITHUB_ENV"

      - name: Criar backup full e dump tenant com manifestos reais
        env:
          PGPASSWORD: backup_check_password
        run: |
          bash scripts/linux/backup_postgres.sh \
            --host 127.0.0.1 --port 5432 \
            --database backup_check_source --user backup_check \
            --output-dir /tmp/backup-check-dumps
          bash scripts/linux/backup_tenant_schema.sh \
            --host 127.0.0.1 --port 5432 \
            --database backup_check_source --user backup_check \
            --slug alpha --output-dir /tmp/backup-check-dumps
          full_dump="$(ls /tmp/backup-check-dumps/octobox-*.dump)"
          tenant_dump="$(ls /tmp/backup-check-dumps/tenant-alpha-*.dump)"
          test -s "${full_dump}.manifest.json"
          test -s "${tenant_dump}.manifest.json"
          echo "FULL_DUMP=${full_dump}" >> "$GITHUB_ENV"
          echo "TENANT_DUMP=${tenant_dump}" >> "$GITHUB_ENV"

      - name: Validar integridade e fazer restore tenant em banco novo
        env:
          PGPASSWORD: backup_check_password
        run: |
          bash scripts/linux/restore_tenant_schema.sh \
            --host 127.0.0.1 --port 5432 \
            --user backup_check --slug alpha \
            --target-database octobox_restore_backup_check \
            --backup-file "${TENANT_DUMP}" \
            --base-backup-file "${FULL_DUMP}"
          restored="$(psql --host 127.0.0.1 --port 5432 --username backup_check \
            --dbname octobox_restore_backup_check -tAc \
            "SELECT t.marker || ':' || s.marker || ':' || i.marker || ':' || m.marker \
             FROM box_alpha.backup_tenant_canary t \
             JOIN public.backup_shared_canary s ON s.id=t.shared_id \
             JOIN public.backup_identity_canary i ON i.id=t.student_id \
             JOIN public.backup_membership_canary m ON m.schema_name='box_alpha' AND m.student_id=t.student_id;")"
          if [[ "${restored}" != "tenant-alpha-before-restore:shared-backup-integrity-check:identity-backup-integrity-check:membership-alpha" ]]; then
            echo "Restore nao preservou tenant A e as referencias shared." >&2
            exit 1
          fi
          fingerprint_after="$(psql --host 127.0.0.1 --port 5432 --username backup_check \
            --dbname octobox_restore_backup_check -v ON_ERROR_STOP=1 -tAc \
            "SELECT md5(concat_ws('|', b.box_id, t.id, t.shared_id, t.student_id, t.marker, s.marker, i.marker, m.marker)) \
             FROM box_bravo.backup_tenant_canary t \
             JOIN public.backup_shared_canary s ON s.id=t.shared_id \
             JOIN public.backup_identity_canary i ON i.id=t.student_id \
             JOIN public.backup_box_canary b ON b.schema_name='box_bravo' \
             JOIN public.backup_membership_canary m ON m.schema_name=b.schema_name AND m.student_id=t.student_id")"
          if [[ "${fingerprint_after}" != "${BOX_BRAVO_FINGERPRINT}" ]]; then
            echo "Fingerprint, box B ou membership shared mudou durante a restauracao seletiva." >&2
            exit 1
          fi
          echo "✅ Restore de A isolado preservou FK/identidade/membership shared e fingerprint de B."

      - name: Recusar FK entrante presente apenas no backup full
        env:
          PGPASSWORD: backup_check_password
        run: |
          psql --host 127.0.0.1 --port 5432 --username backup_check \
            --dbname backup_check_source -v ON_ERROR_STOP=1 -c \
            'ALTER TABLE box_bravo.backup_tenant_canary ADD CONSTRAINT incoming_alpha_fk FOREIGN KEY (id) REFERENCES box_alpha.backup_tenant_canary(id)'
          bash scripts/linux/backup_postgres.sh \
            --host 127.0.0.1 --port 5432 \
            --database backup_check_source --user backup_check \
            --output-dir /tmp/backup-check-incoming
          incoming_full="$(ls /tmp/backup-check-incoming/octobox-*.dump)"
          if bash scripts/linux/restore_tenant_schema.sh \
            --host 127.0.0.1 --port 5432 --user backup_check --slug alpha \
            --target-database octobox_restore_incoming_check \
            --backup-file "${TENANT_DUMP}" --base-backup-file "${incoming_full}" \
            > /tmp/restore-incoming.log 2>&1; then
            echo 'Restore deveria recusar dependência do box B antes do DROP.' >&2
            exit 1
          fi
          grep -q 'FKs ou views externas dependem do tenant' /tmp/restore-incoming.log
          preserved="$(psql --host 127.0.0.1 --port 5432 --username backup_check \
            --dbname octobox_restore_incoming_check -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM pg_constraint WHERE conname='incoming_alpha_fk' AND conrelid='box_bravo.backup_tenant_canary'::regclass")"
          test "$preserved" = '1'

      - name: Testes puros do manifesto
        run: |
          python3 -m pip install pytest
          python3 -m pytest tests/test_tenant_backup_manifest.py -q

  # ---------------------------------------------------------------------------
  # Tenant restore semantic checks against a real django-tenants schema.
  # ---------------------------------------------------------------------------
  tenant-restore-semantic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_DB: octobox_restore_ci
          POSTGRES_USER: octobox_restore_ci
          POSTGRES_PASSWORD: octobox_restore_ci_password
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_test.txt

      - name: Restore semantics, external dependencies and unit inventory
        env:
          DATABASE_URL: postgresql://octobox_restore_ci:octobox_restore_ci_password@127.0.0.1:5432/octobox_restore_ci
          TEST_DATABASE_URL: postgresql://octobox_restore_ci:octobox_restore_ci_password@127.0.0.1:5432/octobox_restore_ci
        run: |
          python -m pytest \
            -o "addopts=--create-db --migrations -ra" \
            tests/test_restore_snapshot_disabled.py \
            tests/test_tenant_restore_semantic_smoke.py \
            tests/test_tenant_restore_external_dependencies.py \
            tests/test_tenant_restore_timer_inventory.py \
            --no-cov -q

  # ---------------------------------------------------------------------------
  # Env cifrado: roda backup_env_secrets.sh de verdade (via sudo, como na
  # VPS), usando um par de chaves age gerado na hora e um diretorio local
  # como "remote" (rclone trata caminho local como remote valido, sem
  # precisar de credencial real de R2). Confere que decifra de volta pro
  # conteudo original byte a byte.
  # ---------------------------------------------------------------------------
  env-secrets-backup-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar age e rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone

      - name: Gerar par de chaves age (fora de qualquer coisa parecida com producao)
        run: |
          age-keygen -o /tmp/ci-env-backup-key.txt 2> /tmp/ci-env-backup-key.pub
          recipient="$(grep -oP 'age1[a-z0-9]+' /tmp/ci-env-backup-key.pub)"
          echo "AGE_RECIPIENT=${recipient}" >> "$GITHUB_ENV"

      - name: Montar octobox.env de mentira e rodar o backup real
        run: |
          mkdir -p /tmp/octobox-ci/shared /tmp/octobox-ci/backups
          cat > /tmp/octobox-ci/shared/octobox.env <<'ENVEOF'
          DJANGO_SECRET_KEY=ci-fake-secret-nao-real
          STUDENT_GOOGLE_OAUTH_CLIENT_SECRET=ci-fake-oauth-secret
          PII_ENCRYPTION_KEYRING_JSON='{"ci-key":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          PII_ENCRYPTION_ACTIVE_KEY_ID=ci-key
          MARKER=octobox-env-backup-integrity-check
          ENVEOF
          sudo OCTOBOX_APP_HOME=/tmp/octobox-ci \
               OCTOBOX_ENV_BACKUP_AGE_RECIPIENT="${AGE_RECIPIENT}" \
               OCTOBOX_BACKUP_REMOTE=/tmp/octobox-ci-remote \
               OCTOBOX_BACKUP_REMOTE_PREFIX=env-check \
               bash scripts/linux/backup_env_secrets.sh

      - name: Confere que subiu cifrado pro "remote" e nao em texto plano
        run: |
          remote_file="$(find /tmp/octobox-ci-remote -name 'octobox-env-*.age')"
          echo "Backup remoto: ${remote_file}"
          if grep -q "ci-fake-secret-nao-real" "${remote_file}"; then
            echo "Backup subiu em TEXTO PLANO — vazamento de segredo." >&2
            exit 1
          fi
          if grep -q "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" "${remote_file}"; then
            echo "Backup subiu com chave PII em TEXTO PLANO." >&2
            exit 1
          fi

      - name: Decifrar com a chave privada e comparar byte a byte com o original
        run: |
          remote_file="$(find /tmp/octobox-ci-remote -name 'octobox-env-*.age')"
          age -d -i /tmp/ci-env-backup-key.txt "${remote_file}" > /tmp/octobox-env-restaurado
          diff /tmp/octobox-ci/shared/octobox.env /tmp/octobox-env-restaurado
          echo "✅ Roundtrip de criptografia do env OK — decifrado e identico ao original."

      - name: Confere retencao/local state files
        run: |
          test -s /tmp/octobox-ci/shared/deploy-state/last_env_backup_path
          test -s /tmp/octobox-ci/shared/deploy-state/last_env_backup_remote_path
          echo "✅ Arquivos de estado gravados."
