name: VPS Deploy (Hostgator São Paulo)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit to deploy (must still be the current main head)
        required: true
        type: string
  workflow_run:
    workflows:
      - OctoBox CI Checks (Performance & Integrity)
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: vps-production-main
  cancel-in-progress: false

jobs:
  verify-gates:
    outputs:
      target_sha: ${{ steps.gates.outputs.target_sha }}
      deploy_run_id: ${{ steps.gates.outputs.deploy_run_id }}
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do workflow de deploy
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Testar contrato do gate de deploy
        run: node --test tests/js/deploy_gate_workflow.test.js

      - name: Resolver release e verificar gates do mesmo SHA
        id: gates
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let targetSha;

            if (context.eventName === 'workflow_run') {
              const source = context.payload.workflow_run;
              if (source.conclusion !== 'success' || source.head_branch !== 'main' || source.event !== 'push') {
                core.setFailed('Deploy automático só aceita workflow push concluído com sucesso na main.');
                return;
              }
              const trustedRepo = `${owner}/${repo}`.toLowerCase();
              if (source.head_repository?.full_name?.toLowerCase() !== trustedRepo ||
                  source.repository?.full_name?.toLowerCase() !== trustedRepo) {
                core.setFailed('Workflow de origem não pertence ao repositório confiável.');
                return;
              }
              targetSha = source.head_sha;
            } else {
              if (context.ref !== 'refs/heads/main') {
                core.setFailed('Dispatch de produção precisa usar o workflow da branch main.');
                return;
              }
              targetSha = String(context.payload.inputs?.target_sha || '').trim();
            }

            if (!/^[0-9a-f]{40}$/i.test(targetSha)) {
              core.setFailed('target_sha ausente ou inválido; informe um SHA completo de 40 caracteres.');
              return;
            }
            targetSha = targetSha.toLowerCase();

            const required = [
              'Full Test Suite',
              'CI Gates',
              "OctoBox CI Checks (Performance & Integrity)",
              "Student Onboarding Corridors Regression",
              "Student Onboarding Real Smoke",
              "Security Scanners 🛡️",
              "CURVA Gates",
              'WOD Mobile Gates',
            ];
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            let missing = [...required];
            // 120 x 30s = 60 min para aguardar todos os workflows do SHA, não
            // apenas o workflow_run que disparou este deploy.
            for (let i = 1; i <= 120; i++) {
              const [{ data: main }, { data }] = await Promise.all([
                github.rest.repos.getBranch({ owner, repo, branch: 'main' }),
                github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, branch: 'main', head_sha: targetSha, per_page: 100,
                }),
              ]);
              if (main.commit.sha !== targetSha) {
                core.setFailed(`Release obsoleta: main avançou para ${main.commit.sha}; alvo era ${targetSha}.`);
                return;
              }
              const runs = data.workflow_runs.filter(r =>
                r.head_sha === targetSha && r.head_branch === 'main' && r.event === 'push'
              );
              const selected = new Map();
              for (const name of required) {
                const matches = runs.filter(r => r.name === name).sort((a, b) =>
                  new Date(b.updated_at) - new Date(a.updated_at)
                );
                if (matches.length) selected.set(name, matches[0]);
              }
              const failed = [...selected.entries()].filter(([, run]) =>
                run.status === 'completed' && run.conclusion !== 'success'
              );
              if (failed.length) {
                core.setFailed(`Gates falharam no SHA ${targetSha}: ${failed.map(([name]) => name).join(', ')}`);
                return;
              }
              missing = required.filter(name => selected.get(name)?.conclusion !== 'success');
              if (!missing.length) {
                core.setOutput('target_sha', targetSha);
                core.setOutput('deploy_run_id', String(context.runId));
                return;
              }
              core.info(`Aguardando (${i}/120): ${missing.join(', ')}`);
              await sleep(30000);
            }
            core.setFailed(`Gates incompletos para ${targetSha}: ${missing.join(', ')}`);

  deploy:
    needs: verify-gates
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy no VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_TARGET_SHA: ${{ needs.verify-gates.outputs.target_sha }}
          DEPLOY_RUN_ID: ${{ needs.verify-gates.outputs.deploy_run_id }}
        with:
          envs: DEPLOY_TARGET_SHA,DEPLOY_RUN_ID
          host:    ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:     ${{ secrets.VPS_SSH_KEY }}
          port:    ${{ secrets.VPS_PORT }}
          timeout: 2m
          command_timeout: 20m
          script: |
            set -euo pipefail
            case "$DEPLOY_TARGET_SHA" in
              (*[!0-9a-f]*|'') echo "target SHA inválido" >&2; exit 2 ;;
            esac
            test "${#DEPLOY_TARGET_SHA}" -eq 40
            APP=/srv/octobox/app
            TOOLS=/srv/octobox/shared/deploy-tools
            sudo -u octobox git -C "$APP" fetch origin "$DEPLOY_TARGET_SHA"
            sudo install -d -m 0750 -o root -g octobox "$TOOLS"
            sudo -u octobox git -C "$APP" show "$DEPLOY_TARGET_SHA:scripts/linux/deploy_octobox.sh" | sudo tee "$TOOLS/deploy-${DEPLOY_TARGET_SHA}.sh" >/dev/null
            sudo chmod 0750 "$TOOLS/deploy-${DEPLOY_TARGET_SHA}.sh"
            sudo OCTOBOX_APP_HOME=/srv/octobox bash "$TOOLS/deploy-${DEPLOY_TARGET_SHA}.sh" --sha "$DEPLOY_TARGET_SHA" --run-id "$DEPLOY_RUN_ID"

      - name: Health check pós-deploy
        run: |
          sleep 8
          curl --fail --silent --show-error https://app.octoboxfit.com.br/api/v1/health/
          echo " — OK"

  # ---------------------------------------------------------------------------
  # 2026-08-27: producao ficou 17 dias (10/08-27/08) rodando codigo desatualizado
  # porque o passo "Deploy no VPS via SSH" falhava (chave SSH perdida em rebuild)
  # e ISSO PULAVA o "Health check pós-deploy" acima (step seguinte na mesma job —
  # nao roda se o anterior falhar). Ninguem notou por semanas.
  #
  # Este job roda em `always()` — mesmo se `deploy` falhar — e compara o
  # deployed_sha e loaded_sha que api/v1/health/ expõe contra o SHA aprovado.
  # Se nao bater, falha alto (job vermelho, e-mail de falha do GitHub Actions),
  # independente de qual passo do deploy quebrou ou nao rodou.
  # ---------------------------------------------------------------------------
  check-deployed-version:
    needs: [verify-gates, deploy]
    if: always() && needs.verify-gates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar que produção está no commit mais recente de main
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.verify-gates.outputs.target_sha }}"
          echo "SHA aprovado pelos gates: $EXPECTED"

          RESPONSE="$(curl --fail --silent --show-error --max-time 15 https://app.octoboxfit.com.br/api/v1/health/)"
          echo "Resposta do health check: $RESPONSE"

          DEPLOYED="$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployed_sha") or "ausente")')"
          LOADED="$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("loaded_sha") or "ausente")')"
          CONSISTENT="$(echo "$RESPONSE" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("release_consistent", False)).lower())')"
          echo "Ponteiro deployado: $DEPLOYED"
          echo "SHA carregado pelo processo: $LOADED"

          if [ "$DEPLOYED" != "$EXPECTED" ] || [ "$LOADED" != "$EXPECTED" ] || [ "$CONSISTENT" != "true" ]; then
            echo "::error::Release divergente: esperado $EXPECTED, ponteiro $DEPLOYED, processo $LOADED, consistente=$CONSISTENT."
            exit 1
          fi
          echo "OK: produção está executando exatamente $EXPECTED"
