name: Dependency Drift Report

# Item 4 do relatorio de prevencao de bugs de SDK/versao (2026-08-28).
# So-leitura: lista dependencias desatualizadas no resumo do job, sem abrir
# PR nem instalar nada novo (isso e trabalho do Dependabot, ja configurado
# em .github/dependabot.yml). Existe como rede de seguranca caso PRs do
# Dependabot fiquem paradas sem revisao — mantem visibilidade do drift.

on:
  schedule:
    - cron: "0 12 * * 1" # toda segunda, 12:00 UTC (09:00 America/Sao_Paulo)
  workflow_dispatch: {}

jobs:
  report-outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: List outdated packages
        run: |
          echo "## Dependências desatualizadas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m pip list --outdated --format=columns >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
