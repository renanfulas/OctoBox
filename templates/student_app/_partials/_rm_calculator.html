{% load l10n %}
<section class="student-card student-card--feature student-rm-calculator" data-ui="student-rm-calculator" aria-label="Calculadora de carga">
    <div class="student-section-head">
        <div>
            <span class="student-context-switch">
                <svg class="student-rm-calc__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6"/><path d="M9 11h2"/><path d="M13 11h2"/><path d="M9 15h2"/><path d="M13 15h2"/></svg>
                Calculadora de carga
            </span>
        </div>
    </div>
    <div class="student-rm-percent-chips" role="group" aria-label="Atalhos de percentual do RM">
        <button type="button" class="student-rm-percent-chip" data-rm-percent-chip="60">60%</button>
        <button type="button" class="student-rm-percent-chip is-active" data-rm-percent-chip="70">70%</button>
        <button type="button" class="student-rm-percent-chip" data-rm-percent-chip="80">80%</button>
        <button type="button" class="student-rm-percent-chip" data-rm-percent-chip="90">90%</button>
    </div>
    <div class="student-rm-calc__readout">
        <span class="student-rm-calc__context">
            {% if rm_records %}{{ rm_records.0.exercise_label }} · {% endif %}<span data-ui="student-rm-percent-label">70</span>%
        </span>
        <output class="student-rm-calculator__result" data-ui="student-rm-result">-- kg</output>
    </div>
    <details class="student-rm-calc__manual">
        <summary>Ajustar base e percentual</summary>
        <div class="student-rm-calculator__grid">
            <label>
                <span>RM base</span>
                <span class="student-field-with-unit">
                    <input class="student-input" type="number" min="0" max="999" step="0.5" value="{% if rm_records %}{{ rm_records.0.one_rep_max_kg|unlocalize }}{% else %}0{% endif %}" inputmode="decimal" data-max-integer-digits="3" data-ui="student-rm-base">
                    <span class="student-field-with-unit__suffix">kg</span>
                </span>
            </label>
            <label>
                <span>Percentual</span>
                <span class="student-field-with-unit student-field-with-unit--prefix">
                    <span class="student-field-with-unit__prefix">%</span>
                    <input class="student-input" type="number" min="40" max="100" step="5" value="70" inputmode="numeric" data-ui="student-rm-percent">
                </span>
            </label>
        </div>
    </details>
    <p class="student-copy" data-ui="student-rm-feedback" hidden>Escolha um RM e um percentual válidos para calcular.</p>
</section>
