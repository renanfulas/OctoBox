<section class="student-card student-card--feature student-rm-entry" id="novo-rm">
    <div class="student-section-head">
        <div>
            <span class="student-context-switch">
                <svg class="student-rm-eyebrow-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                Novo RM
            </span>
        </div>
    </div>
    <form method="post" action="{% url 'student-app-rm-add' %}" class="student-form student-form-grid student-rm-entry__form">
        {% csrf_token %}
        <label>
            <span>Movimento</span>
            {{ add_rm_form.exercise_label }}
        </label>
        <label>
            <span>Carga base</span>
            <span class="student-field-with-unit">
                {{ add_rm_form.one_rep_max_kg }}
                <span class="student-field-with-unit__suffix">kg</span>
            </span>
        </label>
        <button type="submit" class="student-primary-action student-rm-entry__submit">Salvar RM</button>
    </form>
</section>
