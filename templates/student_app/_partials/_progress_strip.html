{% load student_shell %}
{% if progress_days %}
<section class="student-progress-strip" aria-label="Próximos 7 dias">
    <div class="student-progress-strip__head">
        <span class="student-context-switch">Sua semana</span>
        <span class="student-progress-strip__score">{{ progress_days|complete_count }} de {{ progress_days|length }} dias com treino</span>
    </div>
    <div class="student-progress-strip__track">
        {% for day in progress_days %}
        <a
            href="?date={{ day.date|date:'Y-m-d' }}"
            class="student-progress-day student-day-filter{% if day.is_complete %} is-complete{% endif %}{% if day.is_today %} is-today{% endif %}{% if student_selected_date == day.date or not student_selected_date and day.is_today %} is-selected{% endif %}"
            title="{{ day.kind|default:'Sem aula confirmada' }}"
            aria-label="{{ day.day_label }} {{ day.date_label }}{% if day.is_complete %}, com ação registrada{% else %}, sem ação registrada{% endif %}"
            aria-current="{% if student_selected_date == day.date or not student_selected_date and day.is_today %}date{% else %}false{% endif %}"
        >
            {% if day.is_complete %}
            <span class="student-progress-day__check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.5 10 17.5 19 7"/>
                </svg>
            </span>
            {% else %}
            <span class="student-progress-day__dot" aria-hidden="true">·</span>
            {% endif %}
            <span class="student-progress-day__label">{{ day.day_label }}</span>
        </a>
        {% endfor %}
    </div>
</section>
{% endif %}
