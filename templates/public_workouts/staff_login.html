<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar — Curva</title>
<style>
  :root{color-scheme:dark;--curva-cyan:#00e5ff;--curva-bg:#0a0e1a;--curva-surface:#111a2a;--curva-line:rgba(145,169,204,.2);--curva-text:#f1f6ff;--curva-muted:#9aabc4}
  body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 82% 8%,rgba(74,144,226,.17),transparent 32rem),var(--curva-bg);color:var(--curva-text);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;line-height:1.55}
  .card{max-width:390px;width:100%;background:linear-gradient(150deg,rgba(20,31,50,.98),rgba(12,19,32,.98));border:1px solid var(--curva-line);border-radius:20px;padding:clamp(24px,6vw,34px);box-shadow:0 28px 70px rgba(0,0,0,.38)}
  h1{font-size:1.25rem;margin:0 0 4px;}
  .eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#00e5ff;margin:0 0 8px;}
  p{font-size:.9rem;line-height:1.6;color:var(--curva-muted);margin:0 0 16px;}
  label{display:block;font-size:.82rem;font-weight:700;color:#cbd5e1;margin-bottom:6px;}
  input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:11px;border:1px solid var(--curva-line);background:#09111f;color:var(--curva-text);font-size:1rem;margin-bottom:14px;}
  input:focus{outline:2px solid rgba(0,229,255,.58);outline-offset:2px}
  button{width:100%;min-height:48px;padding:12px 14px;border-radius:11px;border:1px solid var(--curva-cyan);background:var(--curva-cyan);color:#07121e;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 8px 24px rgba(0,229,255,.14)}
  :where(button,input):focus-visible{outline:2px solid var(--curva-cyan);outline-offset:3px}
  .error{color:#fca5a5;}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Curva · operação</p>
  <h1>Área interna</h1>
  <p>Acesso restrito à equipe do Curva.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label for="staff-username">Usuário</label>
    <input id="staff-username" type="text" name="username" autocomplete="username" required autofocus>
    <label for="staff-password">Senha</label>
    <input id="staff-password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
