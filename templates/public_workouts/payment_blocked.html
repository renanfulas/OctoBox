<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pagamento pendente — {{ student_name }}</title>
<style>
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#f5efe4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;}
  .card{max-width:380px;width:100%;background:#11203b;border-radius:18px;padding:32px 28px;box-shadow:0 16px 34px rgba(15,23,42,.4);text-align:center;}
  .icon{width:52px;height:52px;border-radius:50%;background:rgba(251,191,36,.12);color:#fbbf24;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px;}
  h1{font-size:1.2rem;margin:0 0 12px;}
  p{font-size:.9rem;line-height:1.55;color:#cbd5e1;margin:0 0 22px;}
  button{width:100%;padding:14px 16px;border-radius:12px;border:0;background:#f5efe4;color:#11203b;font-weight:700;font-size:1rem;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .status{font-size:.82rem;min-height:18px;margin-top:14px;}
  .status[data-state="error"]{color:#fca5a5;}
</style>
</head>
<body>
<div class="card">
  <div class="icon" aria-hidden="true">!</div>
  <h1>Seu acesso está pausado</h1>
  <p>Não conseguimos confirmar o pagamento da sua assinatura. Atualize seus dados de pagamento pra liberar seu treino de novo — leva menos de um minuto.</p>
  <button type="button" id="pagar-btn">Atualizar pagamento</button>
  <p class="status" id="pagar-status" aria-live="polite"></p>
</div>
<script>
(function () {
  function getCookie(name) {
    var parts = (document.cookie || '').split(';');
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i].trim();
      if (part.indexOf(name + '=') === 0) return decodeURIComponent(part.slice(name.length + 1));
    }
    return '';
  }
  var button = document.getElementById('pagar-btn');
  var status = document.getElementById('pagar-status');
  button.addEventListener('click', function () {
    button.disabled = true;
    status.textContent = 'Abrindo pagamento…';
    status.removeAttribute('data-state');
    window.fetch('/treinos/billing-portal', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
    })
      .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok && result.data.portal_url) {
          window.location.href = result.data.portal_url;
          return;
        }
        status.textContent = 'Não foi possível abrir o pagamento agora. Chame no WhatsApp que resolvemos rapidinho.';
        status.setAttribute('data-state', 'error');
        button.disabled = false;
      })
      .catch(function () {
        status.textContent = 'Não foi possível abrir o pagamento agora. Chame no WhatsApp que resolvemos rapidinho.';
        status.setAttribute('data-state', 'error');
        button.disabled = false;
      });
  });
})();
</script>
</body>
</html>
